function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let RNG = mulberry32((Date.now() ^ 0x5bd1e995) >>> 0);
function rand(a = 1, b) { return b === undefined ? RNG() * a : a + RNG() * (b - a); }
function randi(a, b) { return Math.floor(rand(a, b + 1)); }
// 가중치 배열 [[값, 가중치], ...] 에서 하나
function wpick(arr) { let s = 0; for (const x of arr) s += x[1]; let r = rand(s); for (const x of arr) { r -= x[1]; if (r < 0) return x[0]; } return arr[arr.length - 1][0]; }
// 가중치 객체 {키: 가중치} 에서 키 하나
function wkey(obj) { return wpick(Object.entries(obj)); }

function loadMeta() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const m = JSON.parse(raw), f = freshMeta(); META = { ...f, ...m, set: { ...f.set, ...(m.set || {}) }, tut: { ...(m.tut || {}) } }; } } catch (e) { META = freshMeta(); }
}
function saveMeta() { if (!SAVING) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(META)); } catch (e) {} }
const charLv = id => META.chars[id] ? META.chars[id].lv : 0;
function addBall(id, n = 1) { const b = META.balls[id]; if (b) b.copies += n; else { META.balls[id] = { lv: 1, copies: n - 1 }; } }
function addShard(id, n = 1) { // 미해금이면 10개에 해금, 이후 조각은 강화 재료 (최대 레벨이면 핀볼로)
  let extra = 0;
  if (!META.chars[id]) { META.shards[id] = (META.shards[id] || 0) + n; if (META.shards[id] >= PINBALL.shardsToUnlock) { extra = META.shards[id] - PINBALL.shardsToUnlock; delete META.shards[id]; META.chars[id] = { lv: 1, shards: 0 }; } }
  else extra = n;
  if (extra) { const c = META.chars[id]; if (c.lv >= PINBALL.charMaxLv) META.pinball += extra * PINBALL.dupShardPb; else c.shards += extra; }
}
function addPxp(v) { META.pxp += v; let up = 0; while (META.pxp >= PLV.need(META.plv)) { META.pxp -= PLV.need(META.plv); META.plv++; up++; } return up; }

// ===================== 5. 핀볼 규칙 (확률 선결정) =====================
const pbReel = () => 2 + Math.floor((META.best || 0) / 3);
function rollSlot() { return wpick(PINBALL.slots.map((s, i) => [i, s.w])); }
function rollBall(rar) { // 해금된 볼 중 등급 가중치로
  const pool = k => BALL_RARITY[k].filter(f => META.unlocked.includes(f));
  const order = ['unique', 'rare', 'uncommon', 'common'];
  let k = wkey(rar);
  for (let i = order.indexOf(k); i < order.length; i++) if (pool(order[i]).length) { const p = pool(order[i]); return p[randi(0, p.length - 1)]; }
  const all = META.unlocked; return all[randi(0, all.length - 1)];
}
function rollOne(sym) { // 릴 하나의 보상
  if (sym === 'ball') return { kind: 'ball', id: rollBall(PINBALL.rarity) };
  if (sym === 'char') { const locked = HUMAN_IDS.filter(id => !META.chars[id]), own = HUMAN_IDS.filter(id => META.chars[id]); const L = locked.length && rand() < PINBALL.lockedBias ? locked : own; return { kind: 'shard', id: L[randi(0, L.length - 1)] }; }
  return { kind: 'pb', n: pbReel() };
}
function spinJackpot(tutorial) { // 릴 3개 (독립). 튜토리얼은 볼 3개
  const reels = tutorial ? ['ball', 'ball', 'ball'] : [0, 1, 2].map(() => wkey(PINBALL.reel));
  let rewards;
  if (reels[0] === reels[1] && reels[1] === reels[2]) {
    if (reels[0] === 'ball') rewards = [{ kind: 'ball', id: rollBall(PINBALL.tripleBall), big: true }];
    else if (reels[0] === 'char') { const locked = HUMAN_IDS.filter(id => !META.chars[id]); rewards = [locked.length ? { kind: 'char', id: locked[randi(0, locked.length - 1)], big: true } : { kind: 'pb', n: PINBALL.tripleCharPb, big: true }]; }
    else rewards = [{ kind: 'pb', n: pbReel() * PINBALL.tripleMul, big: true }];
  } else rewards = reels.map(rollOne);
  return { reels, rewards };
}
function payOut(rewards, mult) { // 같은 보상 × 배율을 META에 바로 반영
  for (const r of rewards) {
    if (r.kind === 'ball') addBall(r.id, mult);
    else if (r.kind === 'shard') addShard(r.id, mult);
    else if (r.kind === 'char') { if (!META.chars[r.id]) { META.chars[r.id] = { lv: 1, shards: 0 }; delete META.shards[r.id]; if (mult > 1) addShard(r.id, mult - 1); } else addShard(r.id, PINBALL.shardsToUnlock * mult); }
    else META.pinball += r.n * mult;
  }
}

// ---------- 픽셀 스프라이트 ----------
// 왼쪽 절반만 적고 좌우 대칭으로 펼친다. '.' = 투명
const PAL = {k:'#2b1d14', g:'#6cc46a', G:'#3d8f4a', w:'#ffffff', b:'#8a5a3a', y:'#ffd34a',
  h:'#c8d0e0', H:'#7a8098', a:'#e8e2f5', A:'#a89cc8', r:'#d94a4a', n:'#3a3a48',
  o:'#f4efe6', s:'#cfc4b0', p:'#f2a0a8'}; // o 뼈, s 뼈 그림자, p 볼터치
// 주인공: 아기 해골 (큰 두개골, 반짝이는 눈구멍, 볼터치, 빨간 스카프, 작은 몸)
const SPR_SKULL = ['....kkkkk','..kkooooo','.koowoooo','.kooooooo','koooooooo','koooooooo','kookkkooo','kookwkooo','kookkkook','kppoooooo','.kppsoooo','..kokokok','...kkkkkk','..krrrrrr','..kkrrrrk','..knnnnnn','..knnnnnn','..kook...'];
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function sprite(half, pal) {
  const rows = half.map(r => r + [...r].reverse().join('')), c = mkCanvas(rows[0].length, rows.length), x = c.getContext('2d');
  rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') { x.fillStyle = pal[ch] || PAL[ch]; x.fillRect(i, j, 1, 1); } }));
  return c;
}
function tinted(spr, color) { // 상태이상 틴트: 불투명 픽셀 위에만 색을 덮음
  const c = mkCanvas(spr.width, spr.height), x = c.getContext('2d');
  x.drawImage(spr, 0, 0); x.globalCompositeOperation = 'source-atop'; x.globalAlpha = .45; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  c.k = spr.k; return c; // 원본의 표시 배율을 그대로 (빠뜨리면 32칸 거북이 2배로 커짐)
}
function rimmed(spr, color) { // 피격: 몸 색은 그대로 두고 실루엣 바깥 1칸만 붉게 두름
  const c = mkCanvas(spr.width + 2, spr.height + 2), x = c.getContext('2d');
  for (let dx = 0; dx < 3; dx++) for (let dy = 0; dy < 3; dy++) x.drawImage(spr, dx, dy);
  x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = 'source-over'; x.drawImage(spr, 1, 1);

function botAI() {

  }
  const cap = S.caps[0]; if (cap) { const dx = cap.x - p.x, dy = cap.y - p.y, d = Math.hypot(dx, dy) || 1; mx += dx / d * 1.2; my += dy / d * 1.2; }
  else { const g = S.gems.filter(g => g.y > p.y - 260).sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y))[0]; if (g) { const dx = g.x - p.x, dy = g.y - p.y, d = Math.hypot(dx, dy) || 1; mx += dx / d * .8; my += dy / d * .8; } }

}

    reset(level, { picks: o.picks || META.equip.slice(0, 2), saving: false });
    let bossStart = null;
    for (let i = 0; S.mode !== 'result' && S.t < (o.maxT || 480) && i < 2e6; i++) {
      if (S.mode !== 'play') { botModal(); continue; }
      if (i % 4 === 0) botAI();
      update(STEP);
      if (S.phase === 'boss' && bossStart === null) bossStart = S.t;
    }
    const kills = S.kills;
    return { win: !!(S.result && S.result.win), time: +S.t.toFixed(1), hp: Math.round(Math.max(0, S.p.hp)), bossTime: bossStart !== null && S.result && S.result.win ? +(S.t - bossStart - 2.9).toFixed(1) : null, kills, lv: S.lv };
  } finally { S = keep.S; META = keep.META; RNG = keep.RNG; SAVING = keep.SAVING; IN.bot = keep.bot; }
}
function selfTest() {
  const keep = { S, META, RNG, SAVING }, R = [];
  const T = (name, fn) => { let ok = false, info = ''; try { const r = fn(); ok = r === true || (r && r.ok); info = r && r.info || ''; } catch (e) { info = e.message; } R.push({ name, ok, info }); console.log((ok ? 'PASS' : 'FAIL') + ' · ' + name + (info ? ' — ' + info : '')); };
  try {
    META = freshMeta(); SAVING = false; RNG = mulberry32(12345);
    T('회수: 나간 칸은 회수 전 재발사 안 됨', () => { reset(1, { saving: false }); S.phase = 'test'; const e = spawn('knight', CX, 200); e.hp = e.maxHp = 1e9; e.spd = 0; let bad = 0; for (let i = 0; i < 600; i++) { update(STEP); if (S.balls.filter(b => b.slot).length !== S.slots.filter(s => s.out).length) bad++; } return { ok: bad === 0, info: '불일치 ' + bad }; });
    T('회수: 바닥 공 귀환 · 튕긴 공 몸으로 즉시 회수', () => { reset(1, { saving: false }); S.phase = 'test'; const s0 = S.slots[0]; launch(s0, Math.PI / 2 - .3); let ret = false; for (let i = 0; i < 360 && S.balls.length; i++) { update(STEP); if (S.balls[0] && S.balls[0].ret) ret = true; } const s1 = S.slots[1]; launch(s1, -Math.PI / 2); const b = S.balls[0]; b.bounced = true; b.x = S.p.x; b.y = S.p.y - 40; b.vx = 0; b.vy = 650; update(STEP); update(STEP); update(STEP); return { ok: ret && !s0.out && !s1.out && !b.ret }; });
    T('카드: 3장 이하, 새 볼은 장착 덱 안에서만', () => { reset(1, { saving: false }); META.equip = ['fire', 'frost']; let ok = true; for (let i = 0; i < 40; i++) { const c = makeCards(); if (c.length > 3) ok = false; for (const x of c) if (x.k === 'new' && !META.equip.includes(x.fn)) ok = false; } return ok; });
    T('융합: Lv5 두 볼 → 기능 합친 볼 Lv1', () => { reset(1, { saving: false }); S.owned = [newBall(['fire'], 5), newBall(['spark'], 5)]; recalc(); const c = makeCards().find(c => c.k === 'fuse'); if (!c) return false; pickCard(c); closeModal(); return { ok: S.owned.length === 1 && S.owned[0].fns.join() === 'fire,spark' && S.owned[0].lv === 1, info: ballName(S.owned[0]) }; });
    T('진화: 지정 쌍이면 진화 카드가 먼저', () => { reset(1, { saving: false }); S.owned = [newBall(['fire'], 5), newBall(['bomb'], 5)]; recalc(); const c = makeCards(); return { ok: c[0].k === 'evo' && c[0].id === 'inferno', info: c.map(x => x.k).join(',') }; });
    T('핀볼 확률 합 (칸·릴·등급 = 100)', () => { const s = a => a.reduce((x, y) => x + y, 0); const a = s(PINBALL.slots.map(x => x.w)), b = s(Object.values(PINBALL.reel)), c = s(Object.values(PINBALL.rarity)), d = s(Object.values(PINBALL.tripleBall)); return { ok: a === 100 && b === 100 && c === 100 && d === 100, info: [a, b, c, d].join('/') }; });
    T('핀볼 칸 분포 (10만 번, EXP 96% · 잭팟 4%)', () => { let g = 0; const N = 100000, gi = PINBALL.slots.findIndex(s => s.id === 'gift'); for (let i = 0; i < N; i++) if (rollSlot() === gi) g++; return { ok: Math.abs(g / N - .04) < .004, info: (g / N * 100).toFixed(2) + '%' }; });
    T('저장 왕복 (save → load 동일)', () => { const k = localStorage.getItem(SAVE_KEY); SAVING = true; META = freshMeta(); META.pinball = 123; META.plv = 7; META.balls.giant = { lv: 3, copies: 2 }; const before = JSON.stringify(META); saveMeta(); META = null; loadMeta(); const after = JSON.stringify(META); SAVING = false; if (k === null) localStorage.removeItem(SAVE_KEY); else localStorage.setItem(SAVE_KEY, k); return before === after; });
    T('결과 핀볼: 레벨1 첫 클리어 22 · 패배는 진행도 비례', () => { META = freshMeta(); reset(1, { saving: false }); endBattle(true); const w = S.result.pinball; reset(1, { saving: false }); S.wavesDone = 2; endBattle(false); return { ok: w === 22 && S.result.pinball === Math.floor(9 * .5 * .5), info: w + ' / ' + S.result.pinball }; });
  } finally { S = keep.S; META = keep.META; RNG = keep.RNG; SAVING = keep.SAVING; }
  const pass = R.filter(r => r.ok).length;
  console.log('selfTest: ' + pass + '/' + R.length + ' PASS');
  return { pass, total: R.length, results: R };
}


// ===================== 흐름 =====================
function startLevel(id, o = {}) { if (id === 1 && !META.tut.lv1) o.tutorial = true; if (o.tutorial) o.picks = []; reset(id, o); }

// ===================== 15. 입력 =====================
function toLogical(ev) { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) * W / r.width, y: (ev.clientY - r.top) * H / r.height }; }
function hitBtn(pt) { for (let i = BTNS.length - 1; i >= 0; i--) { const b = BTNS[i]; if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) { b.fn(); return true; } } return false; }
function stickUpdate(st, pt) {
  let dx = pt.x - st.ox, dy = pt.y - st.oy; const l = Math.hypot(dx, dy), R = 80;
  if (l > R) { dx = dx / l * R; dy = dy / l * R; }
  st.cx = st.ox + dx; st.cy = st.oy + dy;
  if (st.kind === 'move') st.v = l > 8 ? { x: dx / R, y: dy / R } : { x: 0, y: 0 };
  else st.a = l > 14 ? Math.atan2(dy, dx) : null;
}
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault(); audioInit();
  const pt = toLogical(ev);
  if (ev.pointerType === 'mouse') IN.mouse = pt;
  if (S.mode === 'play' && pt.y >= BOT) { // 받침대 + 볼 슬롯 줄 = 스틱 영역
    const kind = META.set.ctrl === 'tap' || pt.x < W / 2 ? 'move' : 'aim'; // 탭 조준: 아래 어디든 이동 스틱
    const st = { id: ev.pointerId, kind, ox: pt.x, oy: pt.y, cx: pt.x, cy: pt.y, v: null, a: null };
    if (kind === 'move') IN.stickL = st; else IN.stickR = st;
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
    return;
  }
  if (hitBtn(pt)) return;
  if (S.mode === 'play' && pt.y > TOP && pt.y < BOT && META.set.ctrl === 'tap') { IN.tapAim = Math.atan2(pt.y - S.p.y, pt.x - S.p.x); return; } // 보드를 탭한 각도로 고정 조준
  if (S.mode === 'play' && pt.y > TOP && pt.y < BOT && ev.pointerType === 'mouse' && IN.autoAim) IN.moveTo = pt;
});
cv.addEventListener('pointermove', ev => {
  const pt = toLogical(ev);
  if (ev.pointerType === 'mouse') IN.mouse = pt;
  if (IN.stickL && IN.stickL.id === ev.pointerId) stickUpdate(IN.stickL, pt);
  if (IN.stickR && IN.stickR.id === ev.pointerId) stickUpdate(IN.stickR, pt);
});
function endPointer(ev) {
  IN.push = false;
  if (IN.stickL && IN.stickL.id === ev.pointerId) IN.stickL = null;
  if (IN.stickR && IN.stickR.id === ev.pointerId) IN.stickR = null; // 놓으면 자동 조준
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', ev => {
  IN.keys.add(ev.code); audioInit();
  if (ev.code === 'Escape') { if (S.mode === 'settings') closeSettings(); else if (S.mode !== 'title' && S.mode !== 'result') openSettings(); return; }
  const m = S.modal, d = ev.key;
  if (ev.code === 'KeyT') IN.autoAim = !IN.autoAim;
  if (ev.code === 'KeyP') { if (S.mode === 'play') S.mode = 'pause'; else if (S.mode === 'pause') S.mode = 'play'; }
  if (S.mode === 'verdict' && (d === '1' || d === '2')) raidSettle(d === '1' ? 'spare' : 'kill');
  if (S.mode === 'levelup' && m && '123'.includes(d) && m.cards[+d - 1]) pickCard(m.cards[+d - 1]);
  if (S.mode === 'itemcap' && m) { const i = 'qwe'.indexOf(d.toLowerCase()); if (i >= 0 && m.opts[i]) pickItem(m.opts[i]); }
  if (S.mode === 'freeup' && m && (/^[1-8]$/.test(d) || d === ' ' || d === 'Enter')) { if (m.done && m.t > m.spin + .4) closeModal(); else m.t = m.spin; }
  if (S.mode === 'fusion' && m && (d === ' ' || d === 'Enter')) { if (m.t > 2.4) closeModal(); else m.t = 2.4; }
  if ((S.mode === 'select' || S.mode === 'machine') && ev.code === 'Space' && !S.jp && (S.cyc || META.pinball >= MS.mult)) { IN.push = true; if (!S.cyc) { S.cyc = { fired: 0, gifts: 0, fireT: 0, jp: null }; S.mode = 'machine'; } }
  if (ev.code.startsWith('Arrow') || ev.code === 'Space') ev.preventDefault();
});
addEventListener('keyup', ev => { IN.keys.delete(ev.code); if (ev.code === 'Space') IN.push = false; });
addEventListener('blur', () => IN.keys.clear());

// ===================== 16. 메인 루프 =====================
loadMeta();
S = META.seenTitle ? menuState('lobby') : { mode: 'title', t: 0 };
let acc = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > .1) dt = .1;
  acc += dt;
  try {
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    render();
  } catch (e) { acc = 0; console.error(e); }
}
requestAnimationFrame(frame);

// ===================== 17. 테스트 API =====================
window.game = {
  get state() { return S; }, get S() { return S; }, get META() { return META; }, IN, RULE, LEVELS, ENEMY, BOSS, FN, EVO, ITEM,
  get MS() { return MS; }, loadMeta, saveMeta, freshMeta, setMeta(m) { META = m; }, goTab, goLobby, openPrep, pbFire, spinJackpot, payOut, rollSlot, addPxp, baseStats, autoGain,
  selfTest, bot, startRaid, raidSettle, dailyBot, leagueOf, ticketTick,
  start: startLevel, reset, spawn, spawnBoss, launch, update, newBall, makeCards, pickCard, gainXp, recalc, openFreeUp, openItemCap, pickItem, closeModal, finishFreeUp,
  step(sec) { const n = Math.round(sec / STEP); for (let i = 0; i < n; i++) update(STEP); },
  seed(s) { RNG = mulberry32(s >>> 0); },
};
</script>
